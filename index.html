<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>菌衡 · 香菇智能检测大屏</title>
<script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  body{margin:0;background:linear-gradient(180deg,#EEF8F1 0%,#F8FCFA 100%);color:#31473C;font-family:system-ui,"Microsoft YaHei",sans-serif;}
  h1{font-size:24px;padding:26px 28px 4px;margin:0;color:#2C6E58;letter-spacing:1px;}
  .sub{padding:0 28px 6px;margin:0;color:#7A9A8D;font-size:13px;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:14px 28px 40px;}

  .card{background:#fff;border:1px solid #DFEEE6;border-radius:18px;padding:18px 20px;box-shadow:0 8px 24px rgba(75,185,140,.10);}
  .card h3{margin:0 0 10px;font-size:14px;color:#4BB98C;font-weight:600;letter-spacing:.5px;}

  .kpi{font-size:32px;font-weight:700;color:#2C6E58;line-height:1.2;}
  .unit{font-size:15px;color:#7A9A8D;font-weight:500;margin-left:3px;}

  .chart-sm{height:220px;}
  #trend-temp{height:220px;}
  #trend-humid{height:220px;}
  #stage{height:230px;}
  #residue{height:220px;}

  .span2{grid-column:span 2;}
  .span3{grid-column:1 / -1;}

  .warn-list{list-style:none;margin:0;padding:0;}
  .warn-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #EAF4EE;font-size:14px;}
  .warn-item:last-child{border-bottom:none;}
  .warn-time{color:#9DB3A8;font-size:12px;width:48px;flex:none;}
  .warn-text{flex:1;color:#31473C;}
  .tag{font-size:12px;padding:2px 10px;border-radius:999px;flex:none;}
  .tag-warn{background:#FDECEC;color:#D96B6B;}
  .tag-ok{background:#E7F6EE;color:#4BB98C;}

  @media (max-width:600px){ .grid{grid-template-columns:1fr;} .span2{grid-column:span 1;} }
</style>
</head>
<body>
  <h1>菌衡 · 香菇智能检测系统</h1>
  <p class="sub">实时监测 · 异常预警 · 菌渣去向统计（演示数据，接入传感器/检测记录后可自动更新）</p>

  <div class="grid">
    <!-- ===== 第一行：3 个核心指标 ===== -->
    <div class="card"><h3>今日检测</h3><div class="kpi">12<span class="unit">次</span></div></div>
    <div class="card"><h3>预警次数</h3><div class="kpi">3<span class="unit">次</span></div></div>
    <div class="card"><h3>菌渣处理率</h3><div class="kpi">92<span class="unit">%</span></div></div>

    <!-- ===== 第二行：3 个环境指标 ===== -->
    <div class="card"><h3>当前温度</h3><div class="kpi">16<span class="unit">℃</span></div></div>
    <div class="card"><h3>当前湿度</h3><div class="kpi">74<span class="unit">%</span></div></div>
    <div class="card"><h3>光照强度</h3><div class="kpi">320<span class="unit">lux</span></div></div>

    <!-- ===== 第三行：出菇阶段分布 + 近期预警 ===== -->
    <div class="card">
      <h3>出菇阶段分布</h3>
      <div id="stage"></div>
    </div>

    <div class="card span2">
      <h3>近期预警记录</h3>
      <ul class="warn-list">
        <li class="warn-item"><span class="warn-time">09:05</span><span class="warn-text">疑似杂菌斑点（棚东）</span><span class="tag tag-warn">待处理</span></li>
        <li class="warn-item"><span class="warn-time">12:40</span><span class="warn-text">温度偏高 21℃，建议通风降温</span><span class="tag tag-ok">已处理</span></li>
        <li class="warn-item"><span class="warn-time">14:20</span><span class="warn-text">湿度偏低 62%，建议补水增湿</span><span class="tag tag-ok">已处理</span></li>
        <li class="warn-item"><span class="warn-time">16:10</span><span class="warn-text">香菇进入成熟期，建议及时采收</span><span class="tag tag-ok">已处理</span></li>
      </ul>
    </div>

    <!-- ===== 第四行：温度趋势 + 湿度趋势 + 菌渣去向 ===== -->
    <div class="card"><h3>温度趋势（℃）</h3><div id="trend-temp"></div></div>
    <div class="card"><h3>湿度趋势（%）</h3><div id="trend-humid"></div></div>
    <div class="card"><h3>菌渣去向占比</h3><div id="residue"></div></div>
  </div>

<script>
  // ===== 出菇阶段分布（环形图）=====
  const stageChart = echarts.init(document.getElementById('stage'));
  stageChart.setOption({
    tooltip:{trigger:'item', formatter:'{b}: {c}%'},
    legend:{bottom:0, textStyle:{color:'#7A9A8D'}, itemWidth:10, itemHeight:10},
    series:[{
      type:'pie',
      radius:['46%','70%'],
      center:['50%','44%'],
      itemStyle:{borderColor:'#fff', borderWidth:2},
      label:{color:'#31473C', fontSize:12},
      data:[
        {value:25, name:'菌丝期', itemStyle:{color:'#8FDDBF'}},
        {value:30, name:'原基期', itemStyle:{color:'#5ECBA1'}},
        {value:30, name:'幼菇期', itemStyle:{color:'#74B9E8'}},
        {value:15, name:'成熟期', itemStyle:{color:'#F4C88A'}}
      ]
    }]
  });

  // ===== 温度趋势（折线）=====
  const hours = ["8时","10时","12时","14时","16时","18时"];
  const temp  = [15, 17, 19, 18, 16, 14];
  const tempChart = echarts.init(document.getElementById('trend-temp'));
  tempChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis'},
    grid:{top:20,left:36,right:12,bottom:28},
    xAxis:{type:'category', data:hours, axisLabel:{color:'#7A9A8D',fontSize:10}, axisLine:{lineStyle:{color:'#DFEEE6'}}},
    yAxis:{type:'value', axisLabel:{color:'#7A9A8D',fontSize:10}, splitLine:{lineStyle:{color:'#EAF4EE'}}},
    series:[{name:'温度', type:'line', data:temp, smooth:true,
      itemStyle:{color:'#5ECBA1'}, areaStyle:{opacity:.14},
      markLine:{silent:true, symbol:'none', label:{color:'#9DB3A8',fontSize:10},
        lineStyle:{color:'#F4C88A',type:'dashed'},
        data:[{yAxis:20, label:{formatter:'适宜上限 20℃'}}]}
    }]
  });

  // ===== 湿度趋势（折线）=====
  const humid = [75, 72, 68, 70, 74, 78];
  const humidChart = echarts.init(document.getElementById('trend-humid'));
  humidChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis'},
    grid:{top:20,left:36,right:12,bottom:28},
    xAxis:{type:'category', data:hours, axisLabel:{color:'#7A9A8D',fontSize:10}, axisLine:{lineStyle:{color:'#DFEEE6'}}},
    yAxis:{type:'value', axisLabel:{color:'#7A9A8D',fontSize:10}, splitLine:{lineStyle:{color:'#EAF4EE'}}},
    series:[{name:'湿度', type:'line', data:humid, smooth:true,
      itemStyle:{color:'#74B9E8'}, areaStyle:{opacity:.12},
      markLine:{silent:true, symbol:'none', label:{color:'#9DB3A8',fontSize:10},
        lineStyle:{color:'#F4C88A',type:'dashed'},
        data:[{yAxis:70, label:{formatter:'适宜下限 70%'}}]}
    }]
  });

  // ===== 菌渣去向（横向条形图）=====
  const residueChart = echarts.init(document.getElementById('residue'));
  residueChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},
    grid:{top:10,left:70,right:24,bottom:10},
    xAxis:{type:'value', max:100, axisLabel:{color:'#7A9A8D',fontSize:10}, splitLine:{lineStyle:{color:'#EAF4EE'}}},
    yAxis:{type:'category', data:['基质化利用','堆肥','直接还田'], axisLabel:{color:'#31473C',fontSize:12}, axisLine:{show:false}, axisTick:{show:false}},
    series:[{
      type:'bar',
      data:[55, 30, 15],
      barWidth:16,
      itemStyle:{color:'#5ECBA1', borderRadius:[0,8,8,0]},
      label:{show:true, position:'right', color:'#7A9A8D', fontSize:11, formatter:'{c}%'}
    }]
  });

  window.addEventListener('resize', function(){
    stageChart.resize(); tempChart.resize(); humidChart.resize(); residueChart.resize();
  });
</script>
</body>
</html>
